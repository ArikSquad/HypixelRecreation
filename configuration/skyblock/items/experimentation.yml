items:
  - id: GRAND_EXP_BOTTLE
    material: EXPERIENCE_BOTTLE
    rarity: UNCOMMON
    lore:
      - Grants +1,500 Experience when thrown.
    components:
      - id: CUSTOM_DISPLAY_NAME
        display_name: Grand Experience Bottle
      - id: EXPERIENCE_BOTTLE
        base_experience: 1500
      - id: ITEM_MODEL
        item_model: hypixel_skyblock:item/consumables/grand_experience_bottle
      - id: SELLABLE
        value: 480
      - id: CRAFTABLE
        recipes:
          - type: SHAPED
            recipe-type: NONE
            pattern:
              - LLL
              - ' B '
              - LLL
            ingredients:
              L:
                type: ENCHANTED_LAPIS_LAZULI
                amount: 1
              B:
                type: GLASS_BOTTLE
                amount: 1
            result:
              type: GRAND_EXP_BOTTLE
              amount: 1
            requirements:
              lapis_collection:
                left: '%player.collection:LAPIS_LAZULI%'
                operation: '>='
                right: '10000'
                fail-message: '<c>Requires Lapis Lazuli Collection V!'

  - id: TITANIC_EXP_BOTTLE
