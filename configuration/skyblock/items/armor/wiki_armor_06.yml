items:
  - id: TARANTULA_HELMET
    material: leather_helmet
    name: 'Tarantula Helmet'
    rarity: EPIC
    default_statistics:
      health: 100
      defense: 80
      intelligence: 80
    lore:
      - 'Full Set Bonus: Octodexterity — Every 4 th strike, deal +100% Damage and apply Venom reducing healing by 40% for 4 seconds.'
    components:
      - id: STANDARD_ITEM
        standard_item_type: HELMET
      - id: DEFAULT_CRAFTABLE
        default-craftable: false
        recipes:
          - type: SHAPED
            recipe-type: COMBAT
            pattern:
              - AAA
              - BOB
            ingredients:
              A:
                type: TARANTULA_SILK
                amount: 1
              B:
                type: ENCHANTED_IRON_INGOT
