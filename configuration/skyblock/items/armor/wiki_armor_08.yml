items:
  - id: WEREWOLF_LEGGINGS
    material: leather_leggings
    name: 'Werewolf Leggings'
    rarity: LEGENDARY
    default_statistics:
      ferocity: 10
      intelligence: 50
      defense: 200
    lore:
      - 'Full Set Bonus: Regenerative Howl — Upon activating Ferocity heal players within 25 blocks for 1% of your Defense and gain 50 Defense for 5 s (up to 10 stacks).'
    components:
      - id: STANDARD_ITEM
        standard_item_type: LEGGINGS
      - id: DEFAULT_CRAFTABLE
        default-craftable: false
        recipes:
          - type: SHAPED
            recipe-type: COMBAT
            pattern:
              - AAA
              - AOA
              - AOA
            ingredients:
              A:
                type: WEREWOLF_SKIN
                amount: 4
              O:
                type: AIR
                amount: 1
            result:
              type: WEREWOLF_LEGGINGS
              amount: 1

