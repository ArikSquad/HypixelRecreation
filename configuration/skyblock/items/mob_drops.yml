items:
  - id: EXP_SHARE_CORE
    material: ENDER_EYE
    name: "Exp Share Core"
    rarity: EPIC
    lore:
      - Used to craft the Exp Share pet item.
    components:
      - id: CUSTOM_DISPLAY_NAME
        display_name: Exp Share Core

  - id: LAPIS_CRYSTAL
    material: PRISMARINE_CRYSTALS
    name: "Lapis Crystal"
    rarity: RARE
    lore:
      - Can be used to reforge pickaxes.
    components:
      - id: CUSTOM_DISPLAY_NAME
        display_name: Lapis Crystal

  - id: GOLDEN_POWDER
